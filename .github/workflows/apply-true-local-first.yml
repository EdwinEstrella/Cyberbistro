name: Apply true local-first migration

on:
  push:
    branches:
      - agent/true-local-first-lan-edge
    paths:
      - scripts/apply-true-local-first.mjs
      - scripts/fix-true-local-first-script.mjs
      - scripts/post-fix-generated-local-first.mjs
      - .github/workflows/apply-true-local-first.yml
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/true-local-first-lan-edge
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect existing implementation
        id: state
        shell: bash
        run: |
          if grep -q "export async function syncLanEdge" src/shared/lib/localFirst.ts; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Correct migration script
        if: steps.state.outputs.implemented != 'true'
        run: node scripts/fix-true-local-first-script.mjs

      - name: Apply migration
        if: steps.state.outputs.implemented != 'true'
        run: node scripts/apply-true-local-first.mjs

      - name: Correct generated TypeScript and tests
        run: node scripts/post-fix-generated-local-first.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-local-first-typecheck
          path: typecheck.log
          if-no-files-found: ignore

      - name: Upload generated source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-local-first-generated-source
          path: |
            electron/main.ts
            src/shared/lib/cloudAvailability.ts
            src/shared/lib/localFirst.ts
            src/shared/lib/localFirst.test.ts
            src/shared/hooks/useAuth.ts
            src/shared/hooks/useLocalFirstBootstrap.ts
            src/app/components/AppLayout.tsx
            docs/local-first-plan.md

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-local-first-tests
          path: test.log
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Commit generated implementation
        run: |
          git config user.name "cloudix-local-first-bot"
          git config user.email "cloudix-local-first-bot@users.noreply.github.com"
          git add electron/main.ts src/shared/lib/cloudAvailability.ts src/shared/lib/localFirst.ts src/shared/lib/localFirst.test.ts src/shared/hooks/useAuth.ts src/shared/hooks/useLocalFirstBootstrap.ts src/app/components/AppLayout.tsx docs/local-first-plan.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "validate durable true local-first operation"
            git pull --rebase origin agent/true-local-first-lan-edge
            git push origin HEAD:agent/true-local-first-lan-edge
          fi
