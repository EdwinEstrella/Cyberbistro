name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build renderer and main process
        run: npm run build

  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    needs: verify

    # Real backend + test accounts for the login-driven specs. Override the
    # workflow-level placeholder so the renderer is built against the real
    # Supabase project and the specs can authenticate. Journey/unlinked specs
    # skip themselves when their credentials are absent.
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      CYBERBISTRO_TEST_EMAIL: ${{ secrets.CYBERBISTRO_TEST_EMAIL }}
      CYBERBISTRO_TEST_PASSWORD: ${{ secrets.CYBERBISTRO_TEST_PASSWORD }}
      CYBERBISTRO_E2E_EMAIL: ${{ secrets.CYBERBISTRO_E2E_EMAIL }}
      CYBERBISTRO_E2E_PASSWORD: ${{ secrets.CYBERBISTRO_E2E_PASSWORD }}
      CYBERBISTRO_E2E_PRODUCT: ${{ secrets.CYBERBISTRO_E2E_PRODUCT }}
      CYBERBISTRO_E2E_MESA: ${{ secrets.CYBERBISTRO_E2E_MESA }}
      CYBERBISTRO_UNLINKED_E2E_EMAIL: ${{ secrets.CYBERBISTRO_UNLINKED_E2E_EMAIL }}
      CYBERBISTRO_UNLINKED_E2E_PASSWORD: ${{ secrets.CYBERBISTRO_UNLINKED_E2E_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium chrome

      - name: Build renderer and main process
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7
